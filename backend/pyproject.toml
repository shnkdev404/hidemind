[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munshi"
version = "0.1.0"
description = "Munshi - an Accounts Payable agent that learns with Hindsight memory"
requires-python = ">=3.11"
dependencies = [
    "hindsight-client>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.2",
    "groq>=0.9",
    "tenacity>=8.2",
    "sse-starlette>=2.0",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "faker>=24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.services", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
